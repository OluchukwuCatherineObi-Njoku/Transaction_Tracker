<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>{% block title %}Transaction Tracker{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f172a;
      --surface: #1e293b;
      --surf2:   #2d3f55;
      --border:  #334155;
      --text:    #e2e8f0;
      --muted:   #94a3b8;
      --primary: #818cf8;
      --prim2:   #6366f1;
      --green:   #4ade80;
      --red:     #f87171;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      min-height: 100svh;
    }

    /* ── Header ── */
    .hdr {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.875rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
      gap: 1rem;
    }
    .hdr-title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    /* ── Main container ── */
    .main {
      max-width: 600px;
      margin: 0 auto;
      padding: 1.25rem 1rem 4rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.125rem;
    }
    .card-label {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 0.875rem;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.75rem 1.25rem;
      border-radius: 10px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: filter 0.15s, transform 0.1s;
      min-height: 48px;
      line-height: 1;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .btn:active            { transform: scale(0.96); filter: brightness(0.88); }
    .btn:disabled          { opacity: 0.4; pointer-events: none; }
    .btn-primary           { background: var(--prim2); color: #fff; }
    .btn-danger            { background: rgba(248,113,113,.12); color: var(--red); border: 1px solid rgba(248,113,113,.25); }
    .btn-ghost             { background: var(--surf2); color: var(--text); }
    .btn-outline           { background: transparent; color: var(--primary); border: 1px solid rgba(129,140,248,.35); }
    .btn-full              { width: 100%; }
    .btn-sm                { min-height: 38px; padding: 0.45rem 0.875rem; font-size: 0.82rem; border-radius: 8px; }

    .btn-row               { display: flex; gap: 0.75rem; }
    .btn-row .btn          { flex: 1; }

    /* ── File list ── */
    .file-list  { list-style: none; }
    .file-item  {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.875rem;
      gap: 0.5rem;
    }
    .file-item:last-child { border-bottom: none; }
    .file-name  { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge      {
      font-size: 0.62rem;
      font-weight: 600;
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      background: var(--surf2);
      color: var(--muted);
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ── Upload zone ── */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 1.75rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .upload-zone:hover,
    .upload-zone.dragover { border-color: var(--primary); background: rgba(99,102,241,.06); }
    .upload-zone input[type="file"] { display: none; }
    .upload-icon  { font-size: 2rem; margin-bottom: 0.4rem; }
    .upload-head  { font-weight: 600; margin-bottom: 0.15rem; }
    .upload-hint  { font-size: 0.78rem; color: var(--muted); }

    /* ── Alerts ── */
    .alert {
      padding: 0.875rem 1rem;
      border-radius: 10px;
      font-size: 0.875rem;
      border: 1px solid transparent;
    }
    .alert-success { background: rgba(74,222,128,.1);  border-color: rgba(74,222,128,.3);  color: #86efac; }
    .alert-warning { background: rgba(251,191,36,.1);  border-color: rgba(251,191,36,.3);  color: #fde68a; }
    .alert-danger  { background: rgba(248,113,113,.1); border-color: rgba(248,113,113,.3); color: #fca5a5; }

    /* ── Stat summary grid ── */
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .stat-card { background: var(--surf2); border-radius: 12px; padding: 1rem 0.875rem; }
    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }
    .stat-value {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Color helpers ── */
    .c-green { color: var(--green); }
    .c-red   { color: var(--red); }
    .c-blue  { color: var(--primary); }
    .c-muted { color: var(--muted); }

    /* ── Table ── */
    .tbl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table       { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th {
      text-align: left;
      padding: 0.45rem 0.5rem;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td { padding: 0.6rem 0.5rem; border-bottom: 1px solid var(--border); white-space: nowrap; }
    tr:last-child td   { border-bottom: none; }
    th.r, td.r         { text-align: right; }

    /* ── IP chip ── */
    .ip-chip {
      font-size: 0.7rem;
      font-family: monospace;
      background: var(--surf2);
      color: var(--muted);
      padding: 0.25rem 0.625rem;
      border-radius: 100px;
      border: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    /* ── Empty state ── */
    .empty      { text-align: center; padding: 1.75rem 1rem; color: var(--muted); }
    .empty-icon { font-size: 2.25rem; margin-bottom: 0.4rem; }
    .empty-text { font-size: 0.875rem; }

    /* ── Download list ── */
    .dl-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
      gap: 0.75rem;
    }
    .dl-item:last-child  { border-bottom: none; }
    .dl-name {
      font-size: 0.875rem;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Page heading row ── */
    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .page-title { font-size: 1.05rem; font-weight: 700; }

    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Spacing util ── */
    .mt-1 { margin-top: 0.75rem; }
    .mt-2 { margin-top: 1rem; }
  </style>
</head>
<body>
  <header class="hdr">
    <span class="hdr-title">💳 Transaction Tracker</span>
    {% block header_right %}{% endblock %}
  </header>

  <main class="main">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
