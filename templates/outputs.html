{% extends "base.html" %}
{% block title %}Outputs — Transaction Tracker{% endblock %}

{% block content %}

<div class="page-head">
  <span class="page-title">Outputs</span>
  <a class="btn btn-ghost btn-sm" href="/">← Home</a>
</div>

<div class="card">
  {% if files %}
    {% for f in files %}
    <div class="dl-item">
      <span class="dl-name">{{ f }}</span>
      <a class="btn btn-outline btn-sm" href="/download/{{ f }}">↓ Download</a>
    </div>
    {% endfor %}
  {% else %}
    <div class="empty">
      <div class="empty-icon">📂</div>
      <div class="empty-text">No output files yet — process some CSV files first</div>
    </div>
  {% endif %}
</div>

{% endblock %}
