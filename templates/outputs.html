<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Outputs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <div class="card">
        <div class="card-body">
          <h3 class="card-title">Outputs</h3>
          {% if files %}
            <ul class="list-group">
              {% for f in files %}
                <li class="list-group-item"><a href="/download/{{ f }}">{{ f }}</a></li>
              {% endfor %}
            </ul>
          {% else %}
            <p class="text-muted">No outputs yet.</p>
          {% endif %}
          <p class="mt-3"><a class="btn btn-secondary" href="/">Back</a></p>
        </div>
      </div>
    </div>
  </body>
</html>
