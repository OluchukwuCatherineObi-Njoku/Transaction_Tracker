<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fce7f3">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Transaction Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #fdf2f8;       /* palest blush pink */
      --surface: #ffffff;       /* white cards */
      --surf2:   #fdf2f8;       /* inset tint */
      --border:  #fbcfe8;       /* soft pink border */
      --text:    #1f2937;       /* dark gray — readable on white */
      --muted:   #9ca3af;       /* neutral gray */
      --primary: #db2777;       /* pink-600 */
      --prim2:   #be185d;       /* pink-700 */
      --green:   #059669;       /* emerald — income */
      --orange:  #ea580c;       /* warm orange — expense */
      --violet:  #7c3aed;       /* violet — savings */
      --red:     #dc2626;       /* negative balance only */
      --shadow:  0 1px 4px rgba(219,39,119,.08), 0 1px 2px rgba(219,39,119,.04);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      min-height: 100svh;
    }

    /* ── Lock screen ── */
    #screen-lock {
      position: fixed; inset: 0; z-index: 200;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
    }
    .lock-card {
      background: #fff; border-radius: 24px; padding: 2rem 1.5rem;
      width: 100%; max-width: 360px; text-align: center;
      box-shadow: 0 8px 32px rgba(219,39,119,.15);
      border: 1px solid var(--border);
    }
    .lock-icon  { font-size: 3rem; margin-bottom: .625rem; }
    .lock-title { font-size: 1.2rem; font-weight: 700; color: var(--prim2); margin-bottom: .3rem; }
    .lock-sub   { font-size: .85rem; color: var(--muted); margin-bottom: 1.25rem; }
    .lock-input {
      width: 100%; padding: .75rem 1rem;
      border: 1.5px solid var(--border); border-radius: 12px;
      font-size: 1rem; background: var(--bg); color: var(--text);
      outline: none; transition: border-color .2s;
      font-family: inherit;
    }
    .lock-input:focus { border-color: var(--primary); }
    .lock-input + .lock-input { margin-top: .625rem; }
    .lock-err {
      background: #fff1f2; border: 1px solid #fecdd3; color: #9f1239;
      border-radius: 8px; padding: .5rem .875rem;
      font-size: .82rem; margin-top: .625rem; font-weight: 500;
    }
    .lock-note  { font-size: .7rem; color: var(--muted); margin-top: .875rem; }
    .lock-note a { color: var(--muted); text-decoration: underline; cursor: pointer; }

    /* ── App wrapper (hidden until unlock) ── */
    #app { display: contents; }

    /* ── Header ── */
    .hdr {
      background: #fce7f3; border-bottom: 1px solid #f9a8d4;
      padding: .875rem 1.25rem;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 10; gap: 1rem;
      box-shadow: 0 1px 3px rgba(219,39,119,.06);
    }
    .hdr-title { font-size: 1rem; font-weight: 700; letter-spacing: -.02em; color: var(--prim2); }
    .hdr-right { display: flex; gap: .5rem; align-items: center; }

    /* ── Layout ── */
    .main {
      max-width: 600px; margin: 0 auto;
      padding: 1.25rem 1rem 5rem;
      display: flex; flex-direction: column; gap: 1rem;
    }

    /* ── Cards ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 1.125rem;
      box-shadow: var(--shadow);
    }
    .card-label {
      font-size: .68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; color: var(--muted); margin-bottom: .875rem;
      display: flex; align-items: center; justify-content: space-between;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
      padding: .75rem 1.25rem; border-radius: 12px; border: none;
      font-size: .95rem; font-weight: 600; cursor: pointer; text-decoration: none;
      transition: filter .15s, transform .1s;
      min-height: 48px; line-height: 1;
      -webkit-tap-highlight-color: transparent; user-select: none;
      font-family: inherit;
    }
    .btn:active   { transform: scale(.96); filter: brightness(.9); }
    .btn:disabled { opacity: .45; pointer-events: none; }
    .btn-primary  { background: linear-gradient(135deg, #db2777, #be185d); color: #fff; box-shadow: 0 2px 8px rgba(190,24,93,.28); }
    .btn-danger   { background: #fff1f2; color: #e11d48; border: 1.5px solid #fecdd3; }
    .btn-ghost    { background: #fdf2f8; color: var(--text); border: 1px solid var(--border); }
    .btn-outline  { background: #fff; color: var(--primary); border: 1.5px solid #f9a8d4; }
    .btn-subtle   { background: transparent; color: var(--muted); border: none; font-size: .82rem; cursor: pointer; padding: .25rem .5rem; font-family: inherit; }
    .btn-subtle:hover { color: var(--primary); }
    .btn-full     { width: 100%; }
    .btn-sm       { min-height: 36px; padding: .4rem .875rem; font-size: .8rem; border-radius: 8px; }
    .btn-icon     { min-height: 30px; padding: .3rem .6rem; font-size: .75rem; border-radius: 6px; background: #fce7f3; color: var(--muted); border: 1px solid var(--border); cursor: pointer; font-family: inherit; }

    /* ── Upload zone ── */
    .upload-zone {
      border: 2px dashed #f9a8d4; border-radius: 14px;
      padding: 1.75rem 1rem; text-align: center; cursor: pointer;
      transition: border-color .2s, background .2s; background: #fdf2f8;
    }
    .upload-zone:hover,
    .upload-zone.dragover { border-color: var(--primary); background: #fce7f3; }
    .upload-zone label    { cursor: pointer; display: block; }
    .upload-zone input    { display: none; }
    .upload-icon { font-size: 2.25rem; margin-bottom: .4rem; }
    .upload-head { font-weight: 600; margin-bottom: .15rem; color: var(--prim2); }
    .upload-hint { font-size: .78rem; color: var(--muted); }

    /* ── File list ── */
    .file-list  { list-style: none; }
    .file-item  {
      display: flex; align-items: center; justify-content: space-between;
      padding: .6rem 0; border-bottom: 1px solid #fce7f3;
      font-size: .875rem; gap: .5rem;
    }
    .file-item:last-child { border-bottom: none; }
    .file-name  { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge      {
      font-size: .62rem; font-weight: 700; padding: .2rem .45rem; border-radius: 5px;
      background: #fce7f3; color: var(--primary); flex-shrink: 0;
      text-transform: uppercase; letter-spacing: .05em;
    }
    .badge-new  { background: #d1fae5; color: var(--green); }

    /* ── Alerts ── */
    .alert {
      padding: .875rem 1rem; border-radius: 12px;
      font-size: .875rem; border: 1px solid transparent; font-weight: 500;
    }
    .alert-success { background: #ecfdf5; border-color: #6ee7b7; color: #065f46; }
    .alert-warning { background: #fffbeb; border-color: #fcd34d; color: #92400e; }
    .alert-danger  { background: #fff1f2; border-color: #fda4af; color: #9f1239; }

    /* ── Stat cards — tinted per category ── */
    .stat-grid  { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    .stat-card  { border-radius: 14px; padding: 1rem .875rem; border: 1px solid transparent; box-shadow: var(--shadow); }
    .stat-card.income      { background: #ecfdf5; border-color: #a7f3d0; }
    .stat-card.expense     { background: #fff7ed; border-color: #fed7aa; }
    .stat-card.savings     { background: #f5f3ff; border-color: #ddd6fe; }
    .stat-card.balance-pos { background: #ecfdf5; border-color: #a7f3d0; }
    .stat-card.balance-neg { background: #fff1f2; border-color: #fecdd3; }

    .stat-label { font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin-bottom: .3rem; }
    .stat-value { font-size: 1.2rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stat-value.sm { font-size: 1rem; }

    /* ── Color helpers ── */
    .c-green  { color: var(--green); }
    .c-orange { color: var(--orange); }
    .c-violet { color: var(--violet); }
    .c-red    { color: var(--red); }
    .c-pink   { color: var(--primary); }
    .c-muted  { color: var(--muted); }

    /* ── History rows ── */
    .history-row {
      display: flex; align-items: center;
      padding: .8rem .5rem; margin: 0 -.5rem;
      border-bottom: 1px solid #fce7f3;
      cursor: pointer; gap: .5rem;
      transition: background .12s;
      border-radius: 10px;
      -webkit-tap-highlight-color: transparent;
    }
    .history-row:last-child { border-bottom: none; }
    .history-row:hover  { background: #fdf2f8; }
    .history-row:active { background: #fce7f3; }
    .history-month { font-weight: 600; font-size: .875rem; flex: 0 0 110px; }
    .history-nums  { display: flex; gap: .75rem; flex: 1; justify-content: flex-end; font-size: .8rem; font-weight: 600; }
    .history-arrow { color: #f9a8d4; font-size: .85rem; flex-shrink: 0; }

    /* ── Generic table ── */
    .tbl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table       { width: 100%; border-collapse: collapse; font-size: .82rem; }
    th {
      text-align: left; padding: .45rem .5rem;
      font-size: .65rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .09em; color: var(--muted);
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    td { padding: .6rem .5rem; border-bottom: 1px solid #fce7f3; color: var(--text); }
    tr:last-child td { border-bottom: none; }
    th.r, td.r { text-align: right; }
    td.desc { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .8rem; }

    /* ── Page heading ── */
    .page-head  { display: flex; align-items: center; justify-content: space-between; }
    .page-title { font-size: 1.05rem; font-weight: 700; }

    /* ── Empty state ── */
    .empty      { text-align: center; padding: 1.75rem 1rem; color: var(--muted); }
    .empty-icon { font-size: 2.25rem; margin-bottom: .4rem; }
    .empty-text { font-size: .875rem; }

    /* ── Change-password inline form ── */
    .pw-form { display: flex; flex-direction: column; gap: .625rem; margin-top: .875rem; }
    .pw-input {
      width: 100%; padding: .65rem .875rem;
      border: 1.5px solid var(--border); border-radius: 10px;
      font-size: .9rem; color: var(--text); background: var(--bg);
      outline: none; transition: border-color .2s; font-family: inherit;
    }
    .pw-input:focus { border-color: var(--primary); }

    /* ── Collapsible upload body ── */
    #upload-body { overflow: hidden; transition: max-height .25s ease; }
    #upload-body.collapsed { max-height: 0 !important; }

    /* ── Download list ── */
    .dl-col { display: flex; flex-direction: column; gap: .625rem; }

    /* ── Footer links ── */
    .footer-links { display: flex; justify-content: center; gap: 1.5rem; padding-top: .5rem; }

    /* ── Util ── */
    .mt-1 { margin-top: .75rem; }
    .divider { height: 1px; background: var(--border); margin: .875rem 0; }
  </style>
</head>
<body>

<!-- ══════════════════ LOCK SCREEN ══════════════════ -->
<div id="screen-lock">
  <div class="lock-card">
    <div class="lock-icon" id="lock-icon">🔒</div>
    <h2 class="lock-title" id="lock-title"></h2>
    <p  class="lock-sub"   id="lock-sub"></p>

    <input type="password" id="lock-pwd"  class="lock-input" placeholder="Password"
           autocomplete="current-password" enterkeyhint="go">
    <input type="password" id="lock-conf" class="lock-input" placeholder="Confirm password"
           autocomplete="new-password" enterkeyhint="go" hidden>

    <div id="lock-err" class="lock-err" hidden></div>

    <button class="btn btn-primary btn-full mt-1" id="lock-btn" onclick="handleUnlock()"></button>
    <p class="lock-note" id="lock-note"></p>
  </div>
</div>

<!-- ══════════════════ APP (hidden until unlock) ══════════════════ -->
<div id="app" style="display:none">

  <header class="hdr">
    <span class="hdr-title">💳 Transaction Tracker</span>
    <div class="hdr-right">
      <button class="btn btn-ghost btn-sm" onclick="lock()">🔒 Lock</button>
    </div>
  </header>

  <main class="main">

    <!-- ─── MAIN SCREEN ─── -->
    <div id="screen-main">

      <div id="alert-box"></div>

      <!-- Upload (collapsible) -->
      <div class="card">
        <div class="card-label">
          <span>Process new files</span>
          <button class="btn-icon" id="toggle-btn" onclick="toggleUpload()">▲ Collapse</button>
        </div>
        <div id="upload-body">
          <div class="upload-zone" id="drop-zone">
            <label for="csv-input">
              <div class="upload-icon">📂</div>
              <div class="upload-head">Tap to select files</div>
              <div class="upload-hint">One or more CIBC CSV exports</div>
            </label>
            <input type="file" id="csv-input" multiple accept=".csv">
          </div>

          <div id="file-card" hidden>
            <div style="margin:.75rem 0 .4rem;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700" id="file-label"></div>
            <ul class="file-list" id="file-list"></ul>
            <div class="mt-1">
              <button class="btn btn-danger btn-sm" onclick="clearFiles()">🗑&nbsp; Clear</button>
            </div>
          </div>

          <button class="btn btn-primary btn-full mt-1" id="btn-process" disabled onclick="handleProcess()">
            ⚡&nbsp; Process files
          </button>
        </div>
      </div>

      <!-- All-time summary -->
      <div id="alltime-section" hidden>
        <div class="stat-grid" id="alltime-grid"></div>
      </div>

      <!-- Monthly history -->
      <div class="card">
        <div class="card-label">
          <span>Monthly history</span>
          <button class="btn-icon" id="clear-history-btn" onclick="confirmClearHistory()" hidden>🗑 Clear all</button>
        </div>
        <div id="history-content">
          <div class="empty">
            <div class="empty-icon">📊</div>
            <div class="empty-text">No history yet — process some CSV files above</div>
          </div>
        </div>
      </div>

      <!-- Footer actions -->
      <div class="footer-links">
        <button class="btn-subtle" onclick="showChangePassword()">🔑 Change password</button>
      </div>

    </div>

    <!-- ─── DETAIL SCREEN ─── -->
    <div id="screen-detail" hidden>

      <div class="page-head">
        <span class="page-title" id="detail-title"></span>
        <button class="btn btn-ghost btn-sm" onclick="showMain()">← Back</button>
      </div>

      <div class="stat-grid" id="detail-stats"></div>

      <div class="card">
        <div class="card-label">Transactions</div>
        <div class="tbl-scroll">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Description</th>
                <th class="r">Amount</th>
              </tr>
            </thead>
            <tbody id="detail-tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-label">Download this month</div>
        <div class="dl-col">
          <button class="btn btn-outline" id="dl-month-btn">
            ↓&nbsp; <span id="dl-month-label"></span>.csv
          </button>
        </div>
      </div>

    </div>

    <!-- ─── CHANGE PASSWORD SCREEN ─── -->
    <div id="screen-chpwd" hidden>

      <div class="page-head">
        <span class="page-title">Change password</span>
        <button class="btn btn-ghost btn-sm" onclick="showMain()">← Back</button>
      </div>

      <div class="card">
        <div class="card-label">Set a new password</div>
        <p style="font-size:.875rem;color:var(--muted);margin-bottom:.875rem">
          Your history will be re-encrypted with the new password.
        </p>
        <div class="pw-form">
          <input type="password" id="chpwd-new"  class="pw-input" placeholder="New password"     autocomplete="new-password"     enterkeyhint="next">
          <input type="password" id="chpwd-conf" class="pw-input" placeholder="Confirm password" autocomplete="new-password"     enterkeyhint="go">
          <div id="chpwd-err" class="lock-err" hidden></div>
          <button class="btn btn-primary btn-full" id="chpwd-btn" onclick="handleChangePassword()">
            Save new password
          </button>
        </div>
      </div>

    </div>

  </main>
</div><!-- /#app -->

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
// Constants
// ═══════════════════════════════════════════════════════════════
const SAVINGS       = 1;
const NULL_TRANSFER = 2;
const EXPENSE       = 3;
const STORAGE_KEY   = 'tt_v2';
const LEGACY_KEY    = 'tt_history';
const PBKDF2_ITERS  = 100_000;

// ═══════════════════════════════════════════════════════════════
// In-memory state
// ═══════════════════════════════════════════════════════════════
let activeKey      = null;   // CryptoKey — in-memory only, gone on lock/close
let currentSalt    = null;   // base64 string stored alongside ciphertext
let historyCache   = {};     // decrypted history, kept in memory while unlocked
let uploadCollapsed = false;

// ═══════════════════════════════════════════════════════════════
// Crypto helpers  (Web Crypto API — no external libraries)
// ═══════════════════════════════════════════════════════════════

function b64Enc(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function b64Dec(str) { return Uint8Array.from(atob(str), c => c.charCodeAt(0)); }

async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const raw = await crypto.subtle.importKey(
    'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: PBKDF2_ITERS, hash: 'SHA-256' },
    raw,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function encryptJSON(obj, key) {
  const iv  = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const ct  = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj)));
  return { iv: b64Enc(iv), ct: b64Enc(ct) };
}

async function decryptJSON(stored, key) {
  const pt = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64Dec(stored.iv) },
    key,
    b64Dec(stored.ct)
  );
  return JSON.parse(new TextDecoder().decode(pt));
}

// ═══════════════════════════════════════════════════════════════
// Storage
// ═══════════════════════════════════════════════════════════════

// Returns { type: 'empty' | 'encrypted' | 'legacy', data }
function detectStorageState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed.ct) return { type: 'encrypted', data: parsed };
    }
    const legacy = localStorage.getItem(LEGACY_KEY);
    if (legacy) return { type: 'legacy', data: JSON.parse(legacy) };
  } catch { /* ignore */ }
  return { type: 'empty' };
}

async function persistHistory() {
  if (!activeKey) throw new Error('Not unlocked');
  const { iv, ct } = await encryptJSON(historyCache, activeKey);
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ v: 2, salt: currentSalt, iv, ct }));
  localStorage.removeItem(LEGACY_KEY);   // clean up any legacy key
}

// Called once during unlock — returns decrypted history
async function setupAndUnlock(password, existingData = null) {
  const salt  = crypto.getRandomValues(new Uint8Array(16));
  currentSalt = b64Enc(salt);
  activeKey   = await deriveKey(password, salt);
  historyCache = existingData || {};
  await persistHistory();
  return historyCache;
}

async function unlockExisting(password, stored) {
  const salt  = b64Dec(stored.salt);
  currentSalt = stored.salt;
  const key   = await deriveKey(password, salt);
  // AES-GCM throws OperationError if password is wrong — that's our wrong-password signal
  const data  = await decryptJSON(stored, key);
  activeKey    = key;
  historyCache = data;
  return historyCache;
}

// ═══════════════════════════════════════════════════════════════
// Core logic  (mirrors cat_trans.py exactly)
// ═══════════════════════════════════════════════════════════════

function nameProcessing(name) {
  if (name.includes('Internet Banking INTERNET TRANSFER'))
    return ['Internet Banking INTERNET TRANSFER', NULL_TRANSFER];
  if (/E-TRANSFER\s+.*?\s+MeeeW/.test(name))
    return ['Internet Banking E-TRANSFER MeeeW', SAVINGS];
  if (name === 'Electronic Funds Transfer PREAUTHORIZED DEBIT SPECIAL DEPOSIT')
    return ['Electronic Funds Transfer PREAUTHORIZED DEBIT SPECIAL DEPOSIT', SAVINGS];
  if (name === 'PAYMENT THANK YOU/PAIEMEN T MERCI')
    return ['PAYMENT THANK YOU/PAIEMEN T MERCI', NULL_TRANSFER];
  return [name.trim(), EXPENSE];
}

function parseCSVText(text) {
  const rows  = [];
  const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
  for (const line of lines) {
    if (!line.trim()) continue;
    const fields = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') {
        if (inQ && line[i + 1] === '"') { cur += '"'; i++; }
        else inQ = !inQ;
      } else if (c === ',' && !inQ) { fields.push(cur); cur = ''; }
      else cur += c;
    }
    fields.push(cur);
    rows.push(fields);
  }
  return rows;
}

function parseLocalDate(str) {
  const p = str.trim().split('-').map(Number);
  if (p.length !== 3 || p.some(isNaN)) return null;
  return new Date(p[0], p[1] - 1, p[2]);
}

function fmtDate(d)  {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtMonth(d) { return fmtDate(d).slice(0, 7); }

function monthLabel(mo) {
  const [y, m] = mo.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString('en-CA', { month: 'long', year: 'numeric' });
}

function readTransactions(csvText) {
  return parseCSVText(csvText).reduce((txs, row) => {
    if (row.length < 4) return txs;
    const [dateStr, name, expense, income] = row;
    const date = parseLocalDate(dateStr);
    if (!date) return txs;
    const [catName, catType] = nameProcessing(name);
    txs.push({
      date,
      name:    catName,
      savings: catType === SAVINGS       && expense.trim() ? parseFloat(expense) || 0 : 0,
      expense: catType === EXPENSE       && expense.trim() ? parseFloat(expense) || 0 : 0,
      income:  catType !== NULL_TRANSFER && income.trim()  ? parseFloat(income)  || 0 : 0,
    });
    return txs;
  }, []);
}

function processTransactions(transactions) {
  let totalIncome = 0, totalExpense = 0, totalSavings = 0;
  const monthly = {};
  for (const t of transactions) {
    const mo = fmtMonth(t.date);
    if (!monthly[mo]) monthly[mo] = { income: 0, expense: 0, savings: 0, balance: 0 };
    monthly[mo].income  += t.income;
    monthly[mo].expense += t.expense;
    monthly[mo].savings += t.savings;
    monthly[mo].balance  = monthly[mo].income - (monthly[mo].expense + monthly[mo].savings);
    totalIncome  += t.income;
    totalExpense += t.expense;
    totalSavings += t.savings;
  }
  return {
    totals: { total_income: totalIncome, total_expense: totalExpense,
              total_savings: totalSavings, balance: totalIncome - totalExpense - totalSavings },
    monthly,
  };
}

function groupByMonth(transactions) {
  return transactions.reduce((acc, t) => {
    const mo = fmtMonth(t.date);
    (acc[mo] = acc[mo] || []).push(t);
    return acc;
  }, {});
}

// ═══════════════════════════════════════════════════════════════
// CSV generation
// ═══════════════════════════════════════════════════════════════

function csvField(v) {
  const s = String(v ?? '');
  return (s.includes(',') || s.includes('"') || s.includes('\n')) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function csvRow(f) { return f.map(csvField).join(','); }

function buildProcessedCSV(transactions, totals) {
  const lines = ['date,name,savings,expense,income'];
  for (const t of transactions)
    lines.push(csvRow([fmtDate(t.date), t.name, t.savings||'', t.expense||'', t.income||'']));
  lines.push('');
  lines.push(csvRow(['TOTAL',   'Income',  totals.total_income,  '', '']));
  lines.push(csvRow(['TOTAL',   'Expense', totals.total_expense, '', '']));
  lines.push(csvRow(['TOTAL',   'Savings', totals.total_savings, '', '']));
  lines.push(csvRow(['BALANCE', 'Total Income - (Total Expense + Total Savings)', totals.balance, '', '']));
  return lines.join('\n');
}

function buildMonthlyCSV(monthly) {
  const lines = ['month,income,expense,savings,balance'];
  for (const mo of Object.keys(monthly).sort()) {
    const r = monthly[mo];
    lines.push(csvRow([mo, r.income, r.expense, r.savings, r.balance]));
  }
  return lines.join('\n');
}

function buildMonthDetailCSV(mo, data) {
  const lines = ['date,name,savings,expense,income'];
  for (const t of [...data.transactions].sort((a,b) => a.date.localeCompare(b.date)))
    lines.push(csvRow([t.date, t.name, t.savings||'', t.expense||'', t.income||'']));
  return lines.join('\n');
}

// ═══════════════════════════════════════════════════════════════
// File download
// ═══════════════════════════════════════════════════════════════

function downloadBlob(filename, content) {
  const blob = new Blob(['﻿' + content], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

// ═══════════════════════════════════════════════════════════════
// Number formatting
// ═══════════════════════════════════════════════════════════════

function fmt(n, dec = 2) {
  return (n < 0 ? '-' : '') + '$' +
    Math.abs(n).toLocaleString('en-CA', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function fmtShort(n) {
  return (n < 0 ? '-' : '') + Math.abs(n).toLocaleString('en-CA', { maximumFractionDigits: 0 });
}

// ═══════════════════════════════════════════════════════════════
// Lock screen
// ═══════════════════════════════════════════════════════════════

function renderLockScreen() {
  const state = detectStorageState();
  const conf  = document.getElementById('lock-conf');
  const title = document.getElementById('lock-title');
  const sub   = document.getElementById('lock-sub');
  const btn   = document.getElementById('lock-btn');
  const note  = document.getElementById('lock-note');
  const icon  = document.getElementById('lock-icon');

  document.getElementById('lock-err').hidden = true;
  document.getElementById('lock-pwd').value  = '';
  conf.value = '';

  if (state.type === 'encrypted') {
    icon.textContent  = '🔒';
    title.textContent = 'Welcome back';
    sub.textContent   = 'Enter your password to view your data';
    conf.hidden       = true;
    btn.textContent   = 'Unlock';
    note.innerHTML    = 'Data encrypted with AES-256-GCM.';
  } else if (state.type === 'legacy') {
    icon.textContent  = '🛡️';
    title.textContent = 'Secure your data';
    sub.textContent   = 'Existing records found — create a password to encrypt them.';
    conf.hidden       = false;
    btn.textContent   = 'Encrypt & continue';
    note.innerHTML    = 'Your records will be encrypted. <strong>Keep your password safe — it cannot be recovered.</strong>';
  } else {
    icon.textContent  = '✨';
    title.textContent = 'Welcome';
    sub.textContent   = 'Create a password to protect your financial data.';
    conf.hidden       = false;
    btn.textContent   = 'Get started';
    note.innerHTML    = 'AES-256-GCM encryption. <strong>Keep your password safe — it cannot be recovered.</strong>';
  }
}

function showLockErr(msg) {
  const el = document.getElementById('lock-err');
  el.textContent = msg;
  el.hidden = false;
}

async function handleUnlock() {
  const pwdEl  = document.getElementById('lock-pwd');
  const confEl = document.getElementById('lock-conf');
  const btn    = document.getElementById('lock-btn');
  const state  = detectStorageState();
  const pwd    = pwdEl.value;

  document.getElementById('lock-err').hidden = true;
  if (!pwd) { showLockErr('Please enter a password.'); pwdEl.focus(); return; }

  if (state.type !== 'encrypted') {
    if (pwd.length < 4)         { showLockErr('Password must be at least 4 characters.'); return; }
    if (pwd !== confEl.value)   { showLockErr('Passwords do not match.'); confEl.focus(); return; }
  }

  btn.disabled    = true;
  btn.textContent = '⏳ Please wait…';

  try {
    if (state.type === 'encrypted') {
      await unlockExisting(pwd, state.data);
    } else {
      const legacy = state.type === 'legacy' ? state.data : null;
      await setupAndUnlock(pwd, legacy);
    }
    pwdEl.value  = '';
    confEl.value = '';
    document.getElementById('screen-lock').style.display = 'none';
    document.getElementById('app').style.display          = '';

    renderHistory(historyCache);
    if (Object.keys(historyCache).length > 0) collapseUpload();

  } catch (e) {
    const isWrongPwd = e.name === 'OperationError' || (e.message && e.message.includes('decrypt'));
    showLockErr(isWrongPwd ? 'Incorrect password. Try again.' : 'Something went wrong: ' + e.message);
    activeKey = null; currentSalt = null;
  } finally {
    btn.disabled    = false;
    btn.textContent = state.type === 'encrypted' ? 'Unlock' : 'Get started';
  }
}

function lock() {
  activeKey    = null;
  currentSalt  = null;
  historyCache = {};
  document.getElementById('screen-lock').style.display = '';
  document.getElementById('app').style.display          = 'none';
  renderLockScreen();
  document.getElementById('lock-pwd').focus();
}

// ═══════════════════════════════════════════════════════════════
// Change password
// ═══════════════════════════════════════════════════════════════

function showChangePassword() {
  document.getElementById('screen-main').hidden   = true;
  document.getElementById('screen-detail').hidden = true;
  document.getElementById('screen-chpwd').hidden  = false;
  document.getElementById('chpwd-new').value  = '';
  document.getElementById('chpwd-conf').value = '';
  document.getElementById('chpwd-err').hidden = true;
  document.getElementById('chpwd-new').focus();
}

async function handleChangePassword() {
  const newPwd  = document.getElementById('chpwd-new').value;
  const confPwd = document.getElementById('chpwd-conf').value;
  const errEl   = document.getElementById('chpwd-err');
  const btn     = document.getElementById('chpwd-btn');

  errEl.hidden = true;
  if (newPwd.length < 4) { errEl.textContent = 'Password must be at least 4 characters.'; errEl.hidden = false; return; }
  if (newPwd !== confPwd) { errEl.textContent = 'Passwords do not match.'; errEl.hidden = false; return; }

  btn.disabled    = true;
  btn.textContent = '⏳ Re-encrypting…';
  try {
    // Generate new salt + key, re-encrypt the same historyCache
    const salt  = crypto.getRandomValues(new Uint8Array(16));
    currentSalt = b64Enc(salt);
    activeKey   = await deriveKey(newPwd, salt);
    await persistHistory();
    showMain();
    showAlert('Password changed successfully.', 'success');
  } catch (e) {
    errEl.textContent = 'Error: ' + e.message;
    errEl.hidden = false;
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Save new password';
  }
}

// ═══════════════════════════════════════════════════════════════
// All-time summary
// ═══════════════════════════════════════════════════════════════

function renderAllTimeSummary(history) {
  const section = document.getElementById('alltime-section');
  const months  = Object.keys(history);
  if (!months.length) { section.hidden = true; return; }

  let inc = 0, exp = 0, sav = 0;
  for (const d of Object.values(history)) {
    inc += d.income || 0; exp += d.expense || 0; sav += d.savings || 0;
  }
  const bal = inc - exp - sav;

  document.getElementById('alltime-grid').innerHTML = `
    <div class="stat-card income">
      <div class="stat-label">All-time income</div>
      <div class="stat-value sm c-green">${fmt(inc)}</div>
    </div>
    <div class="stat-card expense">
      <div class="stat-label">All-time expense</div>
      <div class="stat-value sm c-orange">${fmt(exp)}</div>
    </div>
    <div class="stat-card savings">
      <div class="stat-label">All-time savings</div>
      <div class="stat-value sm c-violet">${fmt(sav)}</div>
    </div>
    <div class="stat-card ${bal >= 0 ? 'balance-pos' : 'balance-neg'}">
      <div class="stat-label">All-time balance</div>
      <div class="stat-value sm ${bal >= 0 ? 'c-green' : 'c-red'}">${fmt(bal)}</div>
    </div>`;
  section.hidden = false;
}

// ═══════════════════════════════════════════════════════════════
// History table
// ═══════════════════════════════════════════════════════════════

function renderHistory(history, highlightMonths = []) {
  const el   = document.getElementById('history-content');
  const btn  = document.getElementById('clear-history-btn');
  const keys = Object.keys(history).sort().reverse();

  if (!keys.length) {
    btn.hidden = true;
    el.innerHTML = `<div class="empty"><div class="empty-icon">📊</div><div class="empty-text">No history yet — process some CSV files above</div></div>`;
    renderAllTimeSummary({});
    return;
  }
  btn.hidden = false;

  el.innerHTML = keys.map(mo => {
    const d     = history[mo];
    const isNew = highlightMonths.includes(mo);
    return `
      <div class="history-row" onclick="openMonth('${mo}')">
        <span class="history-month">
          ${monthLabel(mo)}
          ${isNew ? '<span class="badge badge-new" style="margin-left:.4rem">updated</span>' : ''}
        </span>
        <span class="history-nums">
          <span class="c-green"  title="Income">${fmtShort(d.income)}</span>
          <span class="c-orange" title="Expense">${fmtShort(d.expense)}</span>
          <span class="${d.balance >= 0 ? 'c-green' : 'c-red'}" title="Balance">${fmtShort(d.balance)}</span>
        </span>
        <span class="history-arrow">›</span>
      </div>`;
  }).join('');

  renderAllTimeSummary(history);
}

// ═══════════════════════════════════════════════════════════════
// Screen switching
// ═══════════════════════════════════════════════════════════════

function showMain() {
  document.getElementById('screen-main').hidden   = false;
  document.getElementById('screen-detail').hidden = true;
  document.getElementById('screen-chpwd').hidden  = true;
}

function openMonth(mo) {
  const data = historyCache[mo];
  if (!data) return;

  document.getElementById('screen-main').hidden   = true;
  document.getElementById('screen-detail').hidden = false;
  document.getElementById('screen-chpwd').hidden  = true;

  document.getElementById('detail-title').textContent = monthLabel(mo);

  const bal = data.balance;
  document.getElementById('detail-stats').innerHTML = `
    <div class="stat-card income">
      <div class="stat-label">Income</div>
      <div class="stat-value c-green">${fmt(data.income)}</div>
    </div>
    <div class="stat-card expense">
      <div class="stat-label">Expense</div>
      <div class="stat-value c-orange">${fmt(data.expense)}</div>
    </div>
    <div class="stat-card savings">
      <div class="stat-label">Savings</div>
      <div class="stat-value c-violet">${fmt(data.savings)}</div>
    </div>
    <div class="stat-card ${bal >= 0 ? 'balance-pos' : 'balance-neg'}">
      <div class="stat-label">Balance</div>
      <div class="stat-value ${bal >= 0 ? 'c-green' : 'c-red'}">${fmt(bal)}</div>
    </div>`;

  const txs = [...(data.transactions || [])].sort((a, b) => b.date.localeCompare(a.date));
  document.getElementById('detail-tbody').innerHTML = txs.length
    ? txs.map(t => {
        let amtStr, amtCls;
        if      (t.income  > 0) { amtStr = '+' + fmt(t.income);  amtCls = 'c-green'; }
        else if (t.savings > 0) { amtStr = '-' + fmt(t.savings); amtCls = 'c-violet'; }
        else                    { amtStr = '-' + fmt(t.expense); amtCls = 'c-orange'; }
        return `<tr>
          <td style="white-space:nowrap;font-size:.78rem;color:var(--muted)">${t.date.slice(5)}</td>
          <td class="desc" title="${t.name}">${t.name}</td>
          <td class="r ${amtCls}" style="white-space:nowrap;font-weight:600">${amtStr}</td>
        </tr>`;
      }).join('')
    : `<tr><td colspan="3" style="text-align:center;color:var(--muted);padding:1rem">No transactions</td></tr>`;

  document.getElementById('dl-month-label').textContent = mo;
  document.getElementById('dl-month-btn').onclick = () =>
    downloadBlob(`${mo}.csv`, buildMonthDetailCSV(mo, data));
}

// ═══════════════════════════════════════════════════════════════
// Upload collapse
// ═══════════════════════════════════════════════════════════════

function toggleUpload() {
  const body = document.getElementById('upload-body');
  const btn  = document.getElementById('toggle-btn');
  uploadCollapsed = !uploadCollapsed;
  if (uploadCollapsed) {
    body.style.maxHeight = body.scrollHeight + 'px';
    requestAnimationFrame(() => body.classList.add('collapsed'));
    btn.textContent = '▼ Expand';
  } else {
    body.classList.remove('collapsed');
    body.style.maxHeight = '';
    btn.textContent = '▲ Collapse';
  }
}

function collapseUpload() {
  if (uploadCollapsed) return;
  const body = document.getElementById('upload-body');
  body.style.maxHeight = body.scrollHeight + 'px';
  requestAnimationFrame(() => body.classList.add('collapsed'));
  document.getElementById('toggle-btn').textContent = '▼ Expand';
  uploadCollapsed = true;
}

// ═══════════════════════════════════════════════════════════════
// Clear history
// ═══════════════════════════════════════════════════════════════

async function confirmClearHistory() {
  if (!confirm('Delete all stored monthly history? This cannot be undone.')) return;
  historyCache = {};
  await persistHistory();
  renderHistory({});
  showAlert('History cleared.', 'success');
}

// ═══════════════════════════════════════════════════════════════
// Alerts
// ═══════════════════════════════════════════════════════════════

function showAlert(msg, type) {
  document.getElementById('alert-box').innerHTML =
    msg ? `<div class="alert alert-${type}">${msg}</div>` : '';
}

// ═══════════════════════════════════════════════════════════════
// File selection UI
// ═══════════════════════════════════════════════════════════════

let selectedFiles = [];

function updateFileList() {
  const card  = document.getElementById('file-card');
  const list  = document.getElementById('file-list');
  const label = document.getElementById('file-label');
  const btn   = document.getElementById('btn-process');
  if (!selectedFiles.length) { card.hidden = true; btn.disabled = true; return; }
  const n = selectedFiles.length;
  label.textContent = `${n} file${n !== 1 ? 's' : ''} selected`;
  list.innerHTML = selectedFiles.map(f =>
    `<li class="file-item"><span class="file-name">${f.name}</span><span class="badge">CSV</span></li>`
  ).join('');
  card.hidden = false;
  btn.disabled = false;
}

function clearFiles() {
  selectedFiles = [];
  document.getElementById('csv-input').value = '';
  showAlert('', '');
  updateFileList();
}

// ═══════════════════════════════════════════════════════════════
// Main process handler
// ═══════════════════════════════════════════════════════════════

async function handleProcess() {
  showAlert('', '');
  if (!selectedFiles.length) return;

  const btn = document.getElementById('btn-process');
  btn.disabled    = true;
  btn.textContent = '⏳ Processing…';

  try {
    let transactions = [];
    for (const file of selectedFiles) {
      const text = await readFileText(file);
      transactions = transactions.concat(readTransactions(text));
    }

    if (!transactions.length) {
      showAlert('No valid transactions found — are these CIBC CSV exports?', 'warning');
      return;
    }

    transactions.sort((a, b) => a.date - b.date);

    const { totals, monthly } = processTransactions(transactions);
    const txByMonth           = groupByMonth(transactions);
    const updatedMonths       = Object.keys(monthly);

    // Merge into in-memory cache and save encrypted
    for (const [mo, summary] of Object.entries(monthly)) {
      historyCache[mo] = {
        income: summary.income, expense: summary.expense,
        savings: summary.savings, balance: summary.balance,
        transactions: (txByMonth[mo] || []).map(t => ({
          date: fmtDate(t.date), name: t.name,
          savings: t.savings, expense: t.expense, income: t.income,
        })),
      };
    }
    await persistHistory();

    renderHistory(historyCache, updatedMonths);
    if (!uploadCollapsed) collapseUpload();

    const n = updatedMonths.length;
    showAlert(`Updated ${n} month${n !== 1 ? 's' : ''}: ${updatedMonths.map(monthLabel).join(', ')}.`, 'success');
    clearFiles();

  } catch (err) {
    showAlert(`Error: ${err.message}`, 'danger');
  } finally {
    btn.disabled    = false;
    btn.textContent = '⚡  Process files';
  }
}

function readFileText(file) {
  if (typeof file.text === 'function') return file.text();
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload  = e => resolve(e.target.result);
    reader.onerror = () => reject(new Error(`Could not read ${file.name}`));
    reader.readAsText(file, 'utf-8');
  });
}

// ═══════════════════════════════════════════════════════════════
// Event listeners
// ═══════════════════════════════════════════════════════════════

document.getElementById('csv-input').addEventListener('change', e => {
  selectedFiles = [...e.target.files].filter(f => f.name.toLowerCase().endsWith('.csv'));
  updateFileList();
});

const dropZone = document.getElementById('drop-zone');
['dragenter', 'dragover'].forEach(ev =>
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('dragover'); })
);
['dragleave', 'drop'].forEach(ev =>
  dropZone.addEventListener(ev, () => dropZone.classList.remove('dragover'))
);
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  selectedFiles = [...e.dataTransfer.files].filter(f => f.name.toLowerCase().endsWith('.csv'));
  updateFileList();
});

// Enter key submits on lock screen
document.getElementById('lock-pwd').addEventListener('keydown',  e => { if (e.key === 'Enter') handleUnlock(); });
document.getElementById('lock-conf').addEventListener('keydown', e => { if (e.key === 'Enter') handleUnlock(); });

// Enter key submits on change-password screen
document.getElementById('chpwd-conf').addEventListener('keydown', e => { if (e.key === 'Enter') handleChangePassword(); });

renderLockScreen();
document.getElementById('lock-pwd').focus();
</script>
